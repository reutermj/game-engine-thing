# Third-party dependency declarations for rules_rs (`crate.from_cargo` in
# MODULE.bazel). Bazel is the build system; these manifests only list the
# crates.io deps each Bazel target pulls from `@crates`. After changing one,
# see docs/runbooks/001-regenerate-cargo-lock.md.
[workspace]
resolver = "3"
members = [
    "engine/loader",
    # The physics comparisons: Rapier 2D and 3D, bench-only.
    "engine/std/physics2d/compare",
    "engine/std/physics3d/compare",
    # The scheduler's thread pool: rayon and core_affinity.
    "engine/std/threads",
    # SPIKE (get-3hd.1): wgpu, winit and tiny-skia, for the presentation spike.
    "spikes/presentation",
]
